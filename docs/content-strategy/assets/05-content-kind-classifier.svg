<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">content_kindの具体的な分類基準</title>
  <desc id="desc">同じ短時間外出テーマでも、読者が最後に回答する、行動を終える、方針を選ぶ、商品条件を持つ、使用評価を知る、根拠を理解する、体験を追う、変更を知るという完了状態によって8種類のcontent kindへ分ける。</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { fill: #172033; font: 700 42px Inter, "Noto Sans JP", "Yu Gothic", sans-serif; letter-spacing: -1.4px; }
      .subtitle { fill: #667085; font: 400 20px Inter, "Noto Sans JP", "Yu Gothic", sans-serif; }
      .eyebrow { fill: #34b995; font: 700 15px Inter, sans-serif; letter-spacing: 1px; }
      .question { fill: #fff; stroke: #9bd8c6; stroke-width: 3; }
      .question-main { fill: #173153; font: 700 27px Inter, "Noto Sans JP", "Yu Gothic", sans-serif; }
      .question-sub { fill: #667085; font: 400 16px Inter, "Noto Sans JP", "Yu Gothic", sans-serif; }
      .card { fill: #fff; stroke: #dfe4e1; stroke-width: 2; }
      .outcome { fill: #173153; font: 700 22px Inter, "Noto Sans JP", "Yu Gothic", sans-serif; }
      .kind { fill: #455463; font: 700 15px Consolas, "SFMono-Regular", monospace; }
      .example { fill: #6d7782; font: 400 15px Inter, "Noto Sans JP", "Yu Gothic", sans-serif; }
      .no { fill: #c2414b; font: 700 14px Inter, "Noto Sans JP", sans-serif; }
      .number { fill: #fff; font: 700 14px Inter, sans-serif; }
      .status-head { font: 700 19px Inter, "Noto Sans JP", sans-serif; }
      .status-body { font: 400 14px Inter, "Noto Sans JP", sans-serif; }
      .line { fill: none; stroke: #a5afab; stroke-width: 2.5; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1080"/>
  <text class="eyebrow" x="60" y="55">CONTENT KIND CLASSIFIER · RULE VERSION 1.0.0</text>
  <text class="title" x="60" y="108">同じテーマでも、「読者の完了状態」で8種類へ分ける</text>
  <text class="subtitle" x="60" y="147">媒体・商品名・データソース・最初に見つかったキーワードでは分類しない</text>

  <rect class="question" x="485" y="188" width="630" height="118" rx="22"/>
  <text class="question-main" x="800" y="235" text-anchor="middle">読者が読み終えた時、何を完了できる？</text>
  <text class="question-sub" x="800" y="271" text-anchor="middle">一つのcontent briefには、一つの主な完了状態だけ</text>

  <path class="line" d="M800 306 V338 M220 338 H1380"/>
  <path class="line" d="M220 338 V365 M605 338 V365 M990 338 V365 M1380 338 V365"/>

  <rect class="card" x="55" y="365" width="330" height="202" rx="16"/>
  <circle cx="88" cy="398" r="17" fill="#8f75ba"/>
  <text class="number" x="88" y="403" text-anchor="middle">1</text>
  <text class="outcome" x="116" y="406">一問へ答える</text>
  <rect x="78" y="429" width="212" height="31" rx="6" fill="#f4effa"/>
  <text class="kind" x="91" y="450">problem_prompt</text>
  <text class="example" x="78" y="493">例：外出準備で一番迷う点を</text>
  <text class="example" x="78" y="519">一問だけ聞き、未知条件を回収</text>
  <text class="no" x="78" y="549">× 答えがある解説記事</text>

  <rect class="card" x="440" y="365" width="330" height="202" rx="16"/>
  <circle cx="473" cy="398" r="17" fill="#34b995"/>
  <text class="number" x="473" y="403" text-anchor="middle">2</text>
  <text class="outcome" x="501" y="406">行動を終える</text>
  <rect x="463" y="429" width="222" height="31" rx="6" fill="#eaf8f3"/>
  <text class="kind" x="476" y="450">action_checklist</text>
  <text class="example" x="463" y="493">例：出発15分前の8項目を</text>
  <text class="example" x="463" y="519">完了基準つきで終わらせる</text>
  <text class="no" x="463" y="549">× 商品名・名詞だけの一覧</text>

  <rect class="card" x="825" y="365" width="330" height="202" rx="16"/>
  <circle cx="858" cy="398" r="17" fill="#4a81ad"/>
  <text class="number" x="858" y="403" text-anchor="middle">3</text>
  <text class="outcome" x="886" y="406">方針を一つ選ぶ</text>
  <rect x="848" y="429" width="207" height="31" rx="6" fill="#edf3f8"/>
  <text class="kind" x="861" y="450">decision_guide</text>
  <text class="example" x="848" y="493">例：抱っこ紐・ベビーカー・</text>
  <text class="example" x="848" y="519">併用を条件分岐で選ぶ</text>
  <text class="no" x="848" y="549">× 順番に作業する手順</text>

  <rect class="card" x="1210" y="365" width="335" height="202" rx="16"/>
  <circle cx="1243" cy="398" r="17" fill="#d48a19"/>
  <text class="number" x="1243" y="403" text-anchor="middle">4</text>
  <text class="outcome" x="1271" y="406">商品条件を持つ</text>
  <rect x="1233" y="429" width="285" height="31" rx="6" fill="#fff7e6"/>
  <text class="kind" x="1246" y="450">product_selection_guide</text>
  <text class="example" x="1233" y="493">例：外出バッグを3選定軸と</text>
  <text class="example" x="1233" y="519">2つ以上の代替策で比較</text>
  <text class="no" x="1233" y="549">× Award候補だけの推薦</text>

  <path class="line" d="M220 567 V606 M220 606 H1380"/>
  <path class="line" d="M220 606 V633 M605 606 V633 M990 606 V633 M1380 606 V633"/>

  <rect class="card" x="55" y="633" width="330" height="202" rx="16"/>
  <circle cx="88" cy="666" r="17" fill="#c46e63"/>
  <text class="number" x="88" y="671" text-anchor="middle">5</text>
  <text class="outcome" x="116" y="674">使用評価を知る</text>
  <rect x="78" y="697" width="226" height="31" rx="6" fill="#fff0ed"/>
  <text class="kind" x="91" y="718">first_hand_review</text>
  <text class="example" x="78" y="761">例：本人が3週間使った条件、</text>
  <text class="example" x="78" y="787">長所・弱点・合わない人</text>
  <text class="no" x="78" y="817">× 公式仕様だけの使用感</text>

  <rect class="card" x="440" y="633" width="330" height="202" rx="16"/>
  <circle cx="473" cy="666" r="17" fill="#607b93"/>
  <text class="number" x="473" y="671" text-anchor="middle">6</text>
  <text class="outcome" x="501" y="674">根拠を理解する</text>
  <rect x="463" y="697" width="236" height="31" rx="6" fill="#edf3f8"/>
  <text class="kind" x="476" y="718">evidence_explainer</text>
  <text class="example" x="463" y="761">例：折りたたみサイズ表記の</text>
  <text class="example" x="463" y="787">意味と公式根拠の範囲を整理</text>
  <text class="no" x="463" y="817">× 照合作業の完了が主目的</text>

  <rect class="card" x="825" y="633" width="330" height="202" rx="16"/>
  <circle cx="858" cy="666" r="17" fill="#61a768"/>
  <text class="number" x="858" y="671" text-anchor="middle">7</text>
  <text class="outcome" x="886" y="674">本人の過程を追う</text>
  <rect x="848" y="697" width="196" height="31" rx="6" fill="#edf7ee"/>
  <text class="kind" x="861" y="718">personal_story</text>
  <text class="example" x="848" y="761">例：初外出で詰めすぎ、記録し、</text>
  <text class="example" x="848" y="787">チェックリストを直した経緯</text>
  <text class="no" x="848" y="817">× 第三者体験の一人称化</text>

  <rect class="card" x="1210" y="633" width="335" height="202" rx="16"/>
  <circle cx="1243" cy="666" r="17" fill="#69737d"/>
  <text class="number" x="1243" y="671" text-anchor="middle">8</text>
  <text class="outcome" x="1271" y="674">変更を知る</text>
  <rect x="1233" y="697" width="190" height="31" rx="6" fill="#f0f2f2"/>
  <text class="kind" x="1246" y="718">update_notice</text>
  <text class="example" x="1233" y="761">例：v2で何を変えたか示し、</text>
  <text class="example" x="1233" y="787">公開済み完全版へ案内</text>
  <text class="no" x="1233" y="817">× 変更点のない再投稿</text>

  <rect x="55" y="881" width="1490" height="144" rx="18" fill="#f1f4f2"/>
  <text class="eyebrow" x="83" y="919">CLASSIFICATION RESULT</text>

  <circle cx="98" cy="964" r="10" fill="#34b995"/>
  <text class="status-head" x="120" y="971" fill="#18785f">候補1件</text>
  <text class="status-body" x="214" y="971" fill="#66717c">→ classified</text>

  <circle cx="410" cy="964" r="10" fill="#c98219"/>
  <text class="status-head" x="432" y="971" fill="#9b6518">候補0件</text>
  <text class="status-body" x="526" y="971" fill="#66717c">→ insufficient / 不足項目を返す</text>

  <circle cx="838" cy="964" r="10" fill="#c2414b"/>
  <text class="status-head" x="860" y="971" fill="#a83640">候補2件以上</text>
  <text class="status-body" x="996" y="971" fill="#66717c">→ brief分割、またはambiguousで停止</text>

  <text class="question-sub" x="83" y="1003">商品・アプリはsubject。媒体はtarget。どちらもcontent_kindの代わりにしない。</text>
</svg>
